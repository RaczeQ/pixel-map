name: "Build & deploy docs"
on:
  # Not on the release itself: it runs on a tag, which the github-pages environment does not accept.
  workflow_run:
    workflows: ["Build & publish - PROD"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Build docs 📚
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - uses: pdm-project/setup-pdm@v3
        name: Setup PDM
        with:
          python-version: 3.12
          architecture: x64
          enable-pep582: true
          cache: true
          cache-dependency-path: "**/pdm.lock"
      - name: Install dependencies
        run: pdm install -d -G test --skip=post_install
      - name: Draw the examples and build docs
        run: pdm run tox -e docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Not a step of the build: right after the upload, deploy-pages often does not see the artifact yet
  # (https://github.com/actions/deploy-pages/issues/451).
  deploy:
    name: Deploy docs to GitHub Pages
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
