[tox]
envlist =
    python3.11
    python3.12
    python3.13
isolated_build = True
skip_missing_interpreters = True

[testenv]
groups =
    test
    cli
deps =
    coverage
    pre-commit
commands =
    coverage run --data-file=.coverage.tests --source=pixel_map -m pytest -v -s --durations=20 tests
    coverage combine
    coverage xml -o coverage.{envname}.xml
    coverage report -m
skip_install = true

[testenv:docs]
groups =
    docs
skip_install = false
commands =
    python scripts/screenshots.py docs/examples.md docs/basemaps.md docs/renderers.md
    python -m typer pixel_map.__main__ utils docs --name pixel-map --output docs/cli.md
    zensical build --clean --strict
